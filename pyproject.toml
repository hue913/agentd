[project]
name = "agentd"
version = "0.1.0"
description = "Test-time RL agent kernel (JitRL-style, no gradient updates) with pluggable model providers, plugin/skill/MCP tool bus, SSH operations and remote screen viewing."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  # uvicorn needs a websocket implementation to serve /api/pty/{id}/stream.
  "websockets>=12",
]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agentd = "agentd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentd"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# The existing tree predates ruff. Gate CI on real bugs (undefined names,
# syntax) rather than a 200-item style backlog.
select = ["E9", "F63", "F7", "F82"]

[tool.uv]
# Intel mac / CN network: never compile Rust wheels from source, prefer the mirror.
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
